name: cashier_speech
description: Kasir Suara — aplikasi kasir Android dengan input suara Bahasa Indonesia, offline-first.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0

  # State management
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^4.0.8

  # Navigation
  go_router: ^18.1.4

  # Local database
  drift: ^2.21.0
  drift_flutter: ^0.3.1
  path_provider: ^2.1.0

  # Backend
  supabase_flutter: ^2.8.0

  # Voice input
  speech_to_text: ^7.5.0

  # Network
  connectivity_plus: ^7.3.2

  # Data models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Utilities
  uuid: ^4.4.0
  intl: ^0.20.3

  # Local package
  voice_parser:
    path: packages/voice_parser

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.0
  drift_dev: ^2.21.0
  riverpod_generator: ^4.0.10
  freezed: ^4.0.3
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
